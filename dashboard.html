<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style type="text/tailwindcss">
        @theme {
            --color-clifford: #da373d;
        }
    </style>
</head>
<body>
    <div class="w-[1200px] mx-auto mt-[55px]">
        <img class="mx-auto mb-5" src="./images/ops-img.jpg" alt="ops-img" width="550" height="">
        <h1 class="font-bold text-[85px] font-sens text-center">Ooops...</h1>
        <strong class="block font-semibold text-[35px] text-[#009398] font-sens text-center mt-4">Эта страница ещё не готова</strong>
        <div class="w-[571px] mx-auto text-center mt-4">
            <p class="font-normal text-[20px] text-grey-400 font-sens ">Мы активно работаем над страницей заказов. <br> Она появится в ближайшее время с новыми возможностями!</p>
        </div>
        <div class="w-[622px] mx-auto mt-9 flex gap-3">
            <button class="w-[300px] py-[20px] text-[25px] font-semibold text-white bg-[#009398] rounded-lg border-[2px] border-transparent shadow-[0px_1px_8px_0px_#00000040] hover:text-[#009398] hover:bg-transparent hover:border-[#009398] duration-500 cursor-pointer">
                <a href="./admin.html">← Назад к продуктам</a>
            </button>
            <button class="w-[300px] py-[20px] text-[25px] font-semibold text-white bg-[#009398] rounded-lg border-[2px] border-transparent shadow-[0px_1px_8px_0px_#00000040] hover:text-[#009398] hover:bg-transparent hover:border-[#009398] duration-500 cursor-pointer">
                <a href="/">Перейти на сайт</a>
            </button>
        </div>
    </div>
    
    <script src="./js/Dashboard/dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</body>
</html>
