<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/main.css">
    
    <title>Admin page</title>
    <style type="text/tailwindcss">
        @theme {
            --color-clifford: #da373d;
        }
    </style>
</head>
<body>
    
    <div class="flex bg-[#F8F8F8]">
        <nav class="w-[25%] h-[100vh] bg-white">
            <div class="mt-[34px] pl-[40px] pb-[32px] border-b-[3px] border-b-[#EBEBFF]">
                <img src="./images/Intex-market.uz.svg" alt="Intex-market" width="200" height="48">
            </div>
            <ul class="ml-[40px] mt-[33px] space-y-[15px]">
                <li>
                    <a class="text-[35px] font-normal text-[#009398]" href="./admin.html">Продукты</a>
                </li>
                <li>
                    <a class="text-[35px] font-normal text-[#B4B4C6]" href="./order.html">Заказы</a>
                </li>
            </ul>
        </nav>
        <div class="w-[75%]">
            <div class="flex items-center justify-end mt-[19px] pb-[32px] px-[60px] border-b-[3px] border-b-[#EBEBFF]">
                <a class="text-[22px] font-normal text-[#A6A6A6]" href="./dashboard.html">Просмотр веб-сайта</a>
                <span class="w-[2px] h-[100%] text-[#D6D6D6] ml-[28px]">|</span>
                <div class="flex items-center gap-[10px] ml-[30px]">
                    <img src="./images/person-name.svg" alt="person-name" width="18" height="22">
                    <p class="user-full-name text-[22px] font-normal text-[#A6A6A6]"></p>
                </div>
            </div>
            <div class="mb-[40px] pt-[22px] px-[45px] flex items-center justify-between">
                <div class="">
                    <label class="w-[337px] flex py-[11px] px-[34px] rounded-[30px]  bg-white shadow-[0px_0px_7px_0px_#00000040]">
                        <input class="search-input w-[80%] py-[8px] pr-2 text-[20px] font-bold text-black placeholdertext-[#B4B4C6] outline-none border-r-[1px] border-r-[#E6E6E6]" type="text" placeholder="Найти" autocomplete="off">
                        <div class="w-[20%] pl-[30px] my-auto">
                            <img src="./images/loop.svg" alt="loop-icon" width="24" height="24">
                        </div>
                    </label>
                    <ul class="popup-list h-0 z-10 overflow-hidden bg-[#009398]  mt-2 rounded-lg"></ul>
                </div>
                <button onclick="handleAddProductBtn()" class="w-[222px] py-[20px] text-[20px] font-bold text-white bg-[#009398] rounded-[29px] border-[2px] border-transparent shadow-[0px_1px_8px_0px_#00000040] hover:text-[#009398] hover:bg-transparent hover:border-[#009398] duration-500 cursor-pointer" type="button">+ Добавить продукт</button>
            </div>
            <ul class="flex items-center justify-center space-x-[46px] mb-[66px]">
                <li class="karkasniy-title text-[35px] font-bold text-[#009398] border-b-[3px] border-b-[#009398] cursor-pointer">Каркасные</li>
                <li class="naduvniy-title text-[35px] font-bold text-[#A6A6A6] border-b-[3px] border-b-transparent cursor-pointer">Надувные</li>
            </ul>
            <div class="px-[42px]">
                <table class="w-full">
                    <thead>
                        <tr class="bg-white">
                            <th class="py-[17px] text-[20px] text-center font-normal rounded-l-[30px]">Изображение</th>
                            <th class="py-[17px] text-[20px] text-start font-normal">Цена(сум)</th>
                            <th class="py-[17px] text-[20px] text-start font-normal">Количество</th>
                            <th class="py-[17px] text-[20px] text-start font-normal">Рамка</th>
                            <th class="py-[17px] text-[20px] text-start font-normal rounded-r-[30px]">Действия</th>
                        </tr>
                    </thead>
                    <tbody class="render-product-here"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="modal-wrapper" class="modal-wrapper w-full h-[100vh] fixed inset-0 backdrop-blur scale-0 duration-400">
        <div class="modal-inner w-[800px] mt-[25px] absolute left-0 right-0 pb-[25px] m-auto px-[30px] bg-white rounded-[20px] pt-[40px]"></div>
    </div>
    
    <script src="./js/Admin/admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</body>
</html>
