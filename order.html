<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/main.css">
    
    <title>Order</title>
    <style type="text/tailwindcss">
        @theme {
            --color-clifford: #da373d;
        }
    </style>
</head>
<body>
    
    <div class="flex bg-[#F8F8F8]">
        <nav class="w-[25%] h-[100vh] bg-white">
            <div class="mt-[34px] pl-[40px] pb-[32px] border-b-[3px] border-b-[#EBEBFF]">
                <img src="./images/Intex-market.uz.svg" alt="Intex-market" width="200" height="48">
            </div>
            <ul class="ml-[40px] mt-[33px] space-y-[15px]">
                <li>
                    <a class="text-[35px] font-normal text-[#B4B4C6]" href="./admin.html">Продукты</a>
                </li>
                <li>
                    <a class="text-[35px] font-normal text-[#009398]" href="./order.html">Заказы</a>
                </li>
            </ul>
        </nav>
        
        <div class="w-[75%]">
            <div class="flex items-center justify-end mt-[19px] pb-[32px] px-[60px] border-b-[3px] border-b-[#EBEBFF]">
                <a class="text-[22px] font-normal text-[#A6A6A6]" href="./dashboard.html">Просмотр веб-сайта</a>
                <span class="w-[2px] h-[100%] text-[#D6D6D6] ml-[28px]">|</span>
                <div class="user-box flex items-center gap-[10px] ml-[30px] cursor-pointer">
                    <img src="./images/person-name.svg" alt="person-name" width="18" height="22">
                    <p class="user-full-name text-[22px] font-normal text-[#A6A6A6]"></p>
                </div>
            </div>
            <div class="w-[1200px] mx-auto mt-[55px]">
                <img class="mx-auto mb-5" src="./images/oops-img.png" alt="ops-img" width="550" height="">
                <h1 class="font-bold text-[85px] font-sens text-center">Ooops...</h1>
                <strong class="block font-semibold text-[35px] text-[#009398] font-sens text-center mt-4">Эта страница ещё не готова</strong>
                <div class="w-[571px] mx-auto text-center mt-4">
                    <p class="font-normal text-[20px] text-grey-400 font-sens ">Мы активно работаем над страницей заказов. <br> Она появится в ближайшее время с новыми возможностями!</p>
                </div>
                <div class="w-[622px] mx-auto mt-9 flex gap-3">
                    <a class="w-[300px] py-[20px] text-[25px] font-semibold text-white bg-[#009398] rounded-lg border-[2px] border-transparent shadow-[0px_1px_8px_0px_#00000040] hover:text-[#009398] hover:bg-transparent hover:border-[#009398] duration-500 cursor-pointer text-center" href="./admin.html">← Назад к продуктам</a>
                    <a class="w-[300px] py-[20px] text-[25px] font-semibold text-white bg-[#009398] rounded-lg border-[2px] border-transparent shadow-[0px_1px_8px_0px_#00000040] hover:text-[#009398] hover:bg-transparent hover:border-[#009398] duration-500 cursor-pointer text-center" href="/">Перейти на сайт</a>
                </div>
            </div>
            
            
        </div>
    </div>
    
    
    <script src="./js/Admin/admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</body>
</html>
